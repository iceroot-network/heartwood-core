name: Heartwood production checks

on:
  push:
    branches: [prod]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-merge:
    if: github.event.created == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the merged dev to prod pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA and .base.ref == "prod" and .head.ref == "dev" and .base.repo.full_name == env.GITHUB_REPOSITORY and .head.repo.full_name == env.GITHUB_REPOSITORY)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::Production CI requires this exact commit to be a merged dev to prod PR in this repository."
          exit 1

  verify:
    needs: production-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.0'
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      # tokei counts the code lines that make check holds against each crate's review ceiling.
      - name: Install the line counter
        run: cargo install tokei --version 15.0.0 --locked
      - name: Check workspace, isolated crypto features, and release feature boundaries
        run: make check
      - name: Verify committed golden vectors
        run: cargo run --locked -p heartwood-difftest -- vectors verify packages/crypto/tests/vectors
      - name: Compare Rust subjects against committed reference vectors
        run: cargo run --locked -p heartwood-difftest -- run l0 packages/crypto/tests/vectors --strict
      # Oracle regeneration remains an explicit reproducibility operation: it needs
      # the pinned reference build and external genesis generator. CI never replaces vectors.
