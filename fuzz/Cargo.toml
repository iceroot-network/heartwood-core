# cargo-fuzz targets of the decoders and of the state. This package is excluded from the workspace
# and builds with its own lockfile: cargo fuzz run <target> (nightly), or cargo check here on
# stable.
[package]
name = "heartwood-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
# The fixed aux (a test seam) makes the signatures, and so the ids, of the state targets repeatable.
heartwood-crypto = { path = "../packages/crypto", features = ["fixed-aux"] }
# The manual clock (a test seam) drives the pool's cooldown.
heartwood-kernel = { path = "../packages/kernel", features = ["difftest"] }
# The client's session and download path; the test seam gives the session target its scripted
# peer.
heartwood-p2p = { path = "../packages/p2p", features = ["difftest"] }
heartwood-p2p-wire = { path = "../packages/p2p-wire" }
heartwood-pool = { path = "../packages/pool" }
heartwood-state = { path = "../packages/state" }
heartwood-transactions = { path = "../packages/transactions" }
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# The session target drives the client on a runtime of its own, with tokio's paused clock.
tokio = { version = "~1.53", default-features = false, features = ["rt", "sync", "test-util", "time"] }

[workspace]
members = ["."]

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
