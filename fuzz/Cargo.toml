# cargo-fuzz targets of the decoders. This package is excluded from the workspace and builds with
# its own lockfile: cargo fuzz run <target> (nightly), or cargo check here on stable.
[package]
name = "heartwood-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
heartwood-crypto = { path = "../packages/crypto" }
libfuzzer-sys = "0.4"
heartwood-p2p-wire = { path = "../packages/p2p-wire" }

[workspace]
members = ["."]

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nes_frame"
path = "fuzz_targets/nes_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_message"
path = "fuzz_targets/wire_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "status_verify"
path = "fuzz_targets/status_verify.rs"
test = false
doc = false
bench = false
