[package]
name = "heartwood-difftest"
description = "Differential-test harness: runs the reference implementation as an oracle and compares its results with Heartwood's"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "difftest"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
heartwood-api.workspace = true
heartwood-blockchain = { workspace = true, features = ["difftest"] }
heartwood-core = { workspace = true, features = ["difftest"] }
heartwood-crypto = { workspace = true, features = ["genesis", "legacy-schnorr", "fixed-aux"] }
heartwood-database.workspace = true
heartwood-kernel = { workspace = true, features = ["difftest"] }
heartwood-logger.workspace = true
heartwood-p2p = { workspace = true, features = ["difftest"] }
heartwood-p2p-wire.workspace = true
heartwood-pool.workspace = true
heartwood-state.workspace = true
heartwood-transactions.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The peer network's subjects drive the client's asynchronous parts on a runtime of their own;
# the verifier's runs on a paused clock (test-util). The route corpus's HTTP client binds its
# source address (net, io-util).
tokio = { workspace = true, features = ["io-util", "net", "rt", "test-util", "time"] }
