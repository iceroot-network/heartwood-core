[package]
name = "heartwood-state"
description = "The consensus state of Heartwood Core: wallets, delegates and votes, rounds and the forging schedule, applying and reverting blocks, genesis, the supply check and the state digest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heartwood-crypto.workspace = true
heartwood-kernel.workspace = true
indexmap.workspace = true
serde.workspace = true
thiserror.workspace = true

# The integration tests apply real transactions through the closed handler registry, and read the
# golden vectors and genesis files. Integration tests link the library once, so the handlers
# implement this crate's own trait.
[dev-dependencies]
heartwood-crypto = { workspace = true, features = ["fixed-aux", "genesis"] }
heartwood-transactions.workspace = true
hex.workspace = true
serde_json.workspace = true
