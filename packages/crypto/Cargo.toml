[package]
name = "heartwood-crypto"
description = "Byte-exact transactions, blocks, keys, signatures and milestone rules of Heartwood Core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Pre-BIP340 Schnorr signatures, used only for peer status attestations.
legacy-schnorr = []
# The chain-definition builder for devnets (genesis block, milestones, network and key material).
genesis = []
# `Aux::configured`: the aux that a forger's `aux` option sets for every block signature, as the
# reference's forger reads it from its options. Only heartwood-forger enables it; nothing else may
# choose the aux of a signature in a release build.
forger-aux = []
# Test seam: `Aux::fixed`, reproducible BIP340 signatures for test vectors. Only test code enables
# it (the integration tests below and the difftest harness); a release build never does.
fixed-aux = []

[dependencies]
bs58.workspace = true
getrandom.workspace = true
indexmap.workspace = true
ripemd.workspace = true
secp256k1.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
k256.workspace = true
num-bigint.workspace = true
proptest.workspace = true

# The vector tests sign with the oracle's fixed aux. `cargo test -p heartwood-crypto` runs the unit
# tests and doctests of the default build; `--all-features` runs everything.
[[test]]
name = "blocks"
required-features = ["fixed-aux"]

[[test]]
name = "fee_floor"
required-features = ["fixed-aux"]

[[test]]
name = "genesis"
required-features = ["genesis", "fixed-aux"]

[[test]]
name = "milestones"
required-features = ["fixed-aux"]

[[test]]
name = "milestones_fees"
required-features = ["fixed-aux"]

[[test]]
name = "milestones_rewards"
required-features = ["fixed-aux"]

[[test]]
name = "primitives"
path = "tests/primitives/main.rs"
required-features = ["fixed-aux"]

[[test]]
name = "transactions"
required-features = ["fixed-aux"]
