[package]
name = "heartwood-p2p"
description = "The peer-to-peer network of Heartwood Core: nes sessions over WebSocket, peers and their acceptance, the communicator, status attestations, peer verification, the network monitor, and the server with its controllers and the forger's attestation session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["node", "devnet"]
# Everything but the nes client session and its transport: peers, the communicator, the verifier,
# the monitor, the rules and the server. A node builds the crate with it; heartwood-forger builds
# it without, so that it can reach nothing but the session and the transport. The `testing` module
# compiles without it.
node = []
# A devnet node's addressing read from the options (`devnet`), on by default.
devnet = ["node"]
# Test seam: a sampling generator with a fixed seed, and the scripted mock peer with its
# `mock-peer` binary. Only test code enables it (the harness, the fuzz targets and tests); a
# release build never does.
difftest = []

# The client and the server reach the node's chain, store, pool and online record only through
# the traits of `view` and `node_services`, so the crate's edges are the crypto crate, the kernel
# (without its event bus) and the wire codec. Every reply and request is untrusted input. The
# server's sessions wait on their sockets, timers and shutdown at once (tokio's `macros`).
[dependencies]
futures-util.workspace = true
heartwood-crypto.workspace = true
heartwood-kernel.workspace = true
heartwood-p2p-wire.workspace = true
indexmap.workspace = true
rand.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true

# The tests drive time with tokio's paused clock and the kernel's manual clock.
[dev-dependencies]
# The verifier's tests sign blocks of the committed devnet chain with its derived delegate keys.
heartwood-crypto = { workspace = true, features = ["genesis"] }
heartwood-kernel = { workspace = true, features = ["difftest"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

# The standalone mock peer, for the node's kill and end-to-end tests.
[[bin]]
name = "mock-peer"
path = "src/testing/mock_peer_main.rs"
required-features = ["difftest"]
test = false
doc = false

# The tests of the nes session and the connector run against the mock peer.
[[test]]
name = "session"
required-features = ["node", "difftest"]

[[test]]
name = "connector"
required-features = ["node", "difftest"]

# The session's readiness and the bound dial, which the forger uses without `node`.
[[test]]
name = "forger_link"
required-features = ["difftest"]

[[test]]
name = "acceptance"
required-features = ["node"]

[[test]]
name = "communicator"
required-features = ["node"]

[[test]]
name = "monitor"
required-features = ["node"]

[[test]]
name = "scoring"
required-features = ["node"]

[[test]]
name = "verifier"
required-features = ["node"]
