[workspace]
resolver = "3"
members = ["packages/*", "tools/difftest"]
# cargo-fuzz targets live in fuzz/ and build with their own manifest.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.dependencies]
heartwood-blockchain = { path = "packages/blockchain" }
heartwood-crypto = { path = "packages/crypto" }
heartwood-database = { path = "packages/database" }
heartwood-kernel = { path = "packages/kernel" }
heartwood-logger = { path = "packages/logger" }
heartwood-p2p = { path = "packages/p2p" }
heartwood-p2p-wire = { path = "packages/p2p-wire" }
heartwood-pool = { path = "packages/pool" }
heartwood-state = { path = "packages/state" }
heartwood-transactions = { path = "packages/transactions" }

# Elliptic curves. heartwood-crypto is the only crate that may depend on secp256k1; the version is
# pinned exactly because signatures and key parsing must not change under a lockfile refresh.
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }

# Hashes and encodings. sha2 and ripemd share digest 0.11.
sha2 = "0.11"
ripemd = "0.2"
# Base58 without the `check` feature: the checksum is computed with sha2.
bs58 = { version = "0.5", default-features = false, features = ["std"] }

zeroize = "1.9"
getrandom = "0.4"

# The peer-to-peer client (heartwood-p2p; the harness and the fuzz targets use them too): tokio on
# its long-term-support line, each crate naming the features it needs; tokio-tungstenite 0.29 with
# only `connect` and `handshake`, so no TLS stack; futures-util for the WebSocket's sink and stream
# helpers; rand for the random samples of peers, seeded from the operating system (a fixed seed
# only behind the p2p crate's `difftest` test seam).
tokio = { version = "~1.53", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = "2.14"
thiserror = "2"

# Storage. SQLite, compiled from the bundled source; heartwood-database and heartwood-pool are the
# only crates that may depend on it. `cache` gives `prepare_cached`; `load_extension` must never be
# enabled, and `backup` is left off until a command needs it. The default features are off because
# they add a WebAssembly build of SQLite that no target here uses.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }

# Logging. The facade is tracing without its attribute macros; the subscriber, the appender and
# gzip serve heartwood-logger only. The logger writes the reference's line format itself on the
# subscriber's registry, without ANSI colours from the subscriber; the `fmt` feature is on only
# because tracing-appender's writer needs it. tracing-appender gives each output a writer thread
# that never drops a line and flushes when its guard drops; it brings about nine small crates
# (crossbeam-channel, symlink, time and their dependencies), which a hand-written writer thread
# would save at the cost of code the logger's line budget has no room for.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
flate2 = "1.1.10"

# Tests only. k256 cross-checks the secp256k1 results and is never a normal dependency.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "schnorr", "std"] }
num-bigint = "0.5"
hex = "0.4"
proptest = "1.11"

[profile.release]
overflow-checks = true

[profile.release.package."*"]
overflow-checks = false
